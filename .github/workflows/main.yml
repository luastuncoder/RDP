name: Windows RDP + Tailscale

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Configure RDP
        shell: pwsh
        run: |
          $rdpKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $tcpKey = "$rdpKey\WinStations\RDP-Tcp"

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path $rdpKey `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path $tcpKey `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          # Use the normal RDP security layer
          Set-ItemProperty `
            -Path $tcpKey `
            -Name 'SecurityLayer' `
            -Value 2 `
            -Force

          # Enable the built-in Remote Desktop firewall rules
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          # Make sure the service is running
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP configured."

      - name: Create RDP user
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name 'RDP' `
            -ErrorAction SilentlyContinue

          if (-not $user) {
            New-LocalUser `
              -Name 'RDP' `
              -Password $password `
              -AccountNeverExpires `
              -PasswordNeverExpires:$false `
              -UserMayNotChangePassword:$false

            Write-Host "Created RDP user."
          }
          else {
            Write-Host "RDP user already exists."
          }

          # Add to required groups only if not already present
          $adminMembers = Get-LocalGroupMember `
            -Group 'Administrators' `
            -ErrorAction SilentlyContinue

          if ($adminMembers.Name -notcontains "$env:COMPUTERNAME\RDP") {
            Add-LocalGroupMember `
              -Group 'Administrators' `
              -Member 'RDP'
          }

          $rdpMembers = Get-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -ErrorAction SilentlyContinue

          if ($rdpMembers.Name -notcontains "$env:COMPUTERNAME\RDP") {
            Add-LocalGroupMember `
              -Group 'Remote Desktop Users' `
              -Member 'RDP'
          }

          Write-Host "RDP user configured."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $installer = Join-Path $env:TEMP 'tailscale.msi'

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          $process = Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList @(
              '/i',
              "`"$installer`"",
              '/quiet',
              '/norestart'
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Tailscale installation failed with exit code $($process.ExitCode)."
          }

          Remove-Item $installer -Force

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable was not found."
          }

          & $tailscale up `
            --auth-key=$env:TS_AUTH_KEY `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale failed to connect."
          }

          # Wait for an IPv4 address
          $tsIP = $null

          for ($i = 0; $i -lt 20; $i++) {
            $addresses = @(
              & $tailscale ip -4 2>$null
            )

            $tsIP = $addresses |
              Where-Object { $_ -match '^\d{1,3}(\.\d{1,3}){3}$' } |
              Select-Object -First 1

            if ($tsIP) {
              break
            }

            Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
            throw "No Tailscale IPv4 address was assigned."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IPv4: $tsIP"

      - name: Verify RDP
        shell: pwsh
        run: |
          Write-Host "Testing RDP at $env:TAILSCALE_IP`:3389"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            throw "RDP port 3389 is not reachable."
          }

          Write-Host "RDP connectivity test succeeded."

      - name: Keep runner alive
        shell: pwsh
        run: |
          Write-Host ''
          Write-Host '===== RDP INFORMATION ====='
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host 'Username: RDP'
          Write-Host 'Password: stored in GitHub Actions secret RDP_PASSWORD'
          Write-Host '==========================='
          Write-Host ''

          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP runner active."
            Start-Sleep -Seconds 300
          }
